name: Python CI

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - users: actions/checkout@v2

    -users: actions/setup-python@v2
      with:
        python-version: '3.x'

    - run: pip install -r requirements.txt

    - run: pytest
